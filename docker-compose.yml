services:
  # Ollama - runs Qwen locally on GPU
  ollama:
    image: ollama/ollama:latest
    container_name: qwen-ollama
    ports:
      - "11434:11434"
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  default:
    name: hermes-ai-network
